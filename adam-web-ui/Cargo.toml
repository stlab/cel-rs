[package]
name = "adam-web-ui"
version = "0.1.0"
edition = "2024"
description = "Reusable Dioxus + Spectrum Web Components UI for browsing and editing a live adam-rs Sheet"

[features]
desktop = ["dioxus/desktop"]
web = ["dioxus-primitives/web"]

[dependencies]
dioxus = { version = "0.7.10", features = [] }
adam-rs = { path = "../adam-rs" }
adam-lang = { path = "../adam-lang" }
cel-parser = { path = "../cel-parser" }
cel-runtime = { path = "../cel-runtime" }
cel-std = { path = "../cel-std" }
cel-euclid = { path = "../cel-euclid", features = ["adam"] }
annotate-snippets = "0.12"
anyhow = "1"
indexmap = "2"
num-bigint = "0.4"
num-integer = "0.1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slotmap = "1.1"
dioxus-icons = { version = "0.1.0", default-features = false }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "9a758255ea26e2b20c8cecf4c1c946feb9e71da7", version = "0.0.1", default-features = false }

[dev-dependencies]
dioxus-ssr = "0.7"
dioxus-html = { version = "0.7", features = ["serialize"] }
generational-box = "0.7.10"
keyboard-types = "0.7"
tokio = { version = "1", features = ["rt", "macros", "time"] }

[build-dependencies]
lightningcss = { version = "1.0.0-alpha.71", default-features = false }

[lints]
workspace = true

[[example]]
name = "sheet-binding"
path = "examples/sheet_binding.rs"
required-features = ["desktop"]
