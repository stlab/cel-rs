[package]
name = "adam-lsp"
version = "0.1.0"
edition = "2024"
description = "Language server for adam-lang, surfacing syntax and type diagnostics over LSP"

[dependencies]
cel-parser = { path = "../cel-parser" }
adam-lang = { path = "../adam-lang" }
cel-std = { path = "../cel-std" }
cel-euclid = { path = "../cel-euclid", features = ["adam"] }
lsp-server = "0.10"
lsp-types = "0.97"
serde_json = "1.0"
anyhow = "1.0"

[lib]
name = "adam_lsp"
path = "src/lib.rs"

[[bin]]
name = "adam-lsp"
path = "src/main.rs"

[lints]
workspace = true
