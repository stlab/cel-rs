[package]
name = "begin"
version = "0.1.0"
edition = "2024"
description = "Cross-platform property model development environment"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop", "dep:rfd", "dep:notify"]
web = ["dioxus/web"]
playground = []

[dependencies]
dioxus = { version = "0.7.9", features = [] }
dioxus-devtools = "0.7.9"
futures-channel = "0.3"
futures-util = "0.3"
adam-rs = { path = "../adam-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = "2"
anyhow = "1"
slotmap = "1.0"
cel-parser = { path = "../cel-parser" }
annotate-snippets = "0.12"
adam-lang = { path = "../adam-lang" }
rfd = { version = "0.17.2", optional = true }
notify = { version = "8.2.0", optional = true }

[lints]
workspace = true
