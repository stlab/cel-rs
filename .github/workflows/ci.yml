name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    
    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt --check

    - name: Build workspace (excluding begin app)
      run: cargo build --workspace --exclude begin --verbose

    # --lib skips `begin`/`xtask` automatically (they have no library target), so this
    # covers every documentable crate without needing an --exclude list. RUSTDOCFLAGS
    # promotes rustdoc's own warnings (broken/private intra-doc links, bare URLs, etc.) to
    # errors -- `cargo doc` alone exits 0 on those, so without this they'd only ever
    # surface as a human happening to read `cargo doc`'s output locally.
    - name: Build documentation (deny warnings)
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo doc --workspace --no-deps --lib

    - name: Install mdBook
      uses: peaceiris/actions-mdbook@v2
      with:
        mdbook-version: 'latest'

    # Catches a broken {{#include}} path/anchor in the adam-lang book (adam-lang-book/book-src)
    # the moment a chapter or its backing tests/*.rs example drifts out of sync -- mdbook build
    # fails outright on either, so no separate lint is needed.
    - name: Build the adam-lang book
      run: mdbook build adam-lang-book

    - name: Check begin app (renderer-agnostic)
      run: cargo check -p begin --no-default-features

    - name: Run tests for workspace (excluding begin app)
      run: cargo test --workspace --exclude begin --verbose -- --nocapture

    - name: Clippy workspace (excluding begin app)
      run: cargo clippy --workspace --exclude begin --all-targets -- -D warnings

    - name: Clippy begin app (renderer-agnostic)
      run: cargo clippy -p begin --no-default-features --all-targets -- -D warnings

    # dioxus's desktop feature pulls in wry/tao, which link against WebKitGTK/GTK on Linux.
    # No earlier step needs these: the workspace build/test excludes begin, and the other
    # begin checks use --no-default-features (renderer-agnostic), so this is the first step
    # that actually compiles the desktop feature on the ubuntu-latest runner.
    - name: Install Linux dependencies for begin desktop build
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

    - name: Clippy begin app (desktop features)
      run: cargo clippy -p begin --all-targets -- -D warnings
