name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 22.12.0

    - name: Run begin JavaScript tests
      working-directory: begin
      run: |
        npm ci
        npm test
    
    - name: Install Rust toolchain
      run: |
        rustup toolchain install stable --profile minimal --component rustfmt --component clippy
        rustup default stable
    
    - name: Cache dependencies
      uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

    - name: Check formatting
      run: cargo fmt --check

    # `ez-adam`, like `begin`, defaults to `desktop` (-> `dioxus/desktop` -> wry/tao ->
    # WebKitGTK/GTK on Linux) -- excluded here for the same reason `begin` is: those
    # system libraries aren't installed until the later "Install Linux dependencies"
    # step in the parallel desktop job.
    - name: Build workspace (excluding begin and ez-adam apps)
      run: cargo build --workspace --exclude begin --exclude ez-adam --verbose

    - name: Check begin app (renderer-agnostic)
      run: cargo check -p begin --no-default-features

    - name: Check ez-adam app (renderer-agnostic)
      run: cargo check -p ez-adam --no-default-features

    - name: Run tests for workspace (excluding begin and ez-adam apps)
      run: cargo test --workspace --exclude begin --exclude ez-adam --verbose -- --nocapture

    - name: Run tests for begin app (renderer-agnostic)
      run: cargo test -p begin --no-default-features --verbose -- --nocapture

    - name: Run tests for ez-adam app (renderer-agnostic)
      run: cargo test -p ez-adam --no-default-features --verbose -- --nocapture

    - name: Clippy workspace (excluding begin and ez-adam apps)
      run: cargo clippy --workspace --exclude begin --exclude ez-adam --all-targets -- -D warnings

    - name: Clippy begin app (renderer-agnostic)
      run: cargo clippy -p begin --no-default-features --all-targets -- -D warnings

    - name: Clippy ez-adam app (renderer-agnostic)
      run: cargo clippy -p ez-adam --no-default-features --all-targets -- -D warnings

  desktop:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust toolchain
      run: |
        rustup toolchain install stable --profile minimal --component clippy
        rustup default stable

    - name: Cache dependencies
      uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

    # dioxus's desktop feature pulls in wry/tao, which link against WebKitGTK/GTK on Linux.
    # This job runs independently from the renderer-agnostic Rust checks so package
    # installation and desktop compilation do not extend their critical path.
    - name: Install Linux dependencies for begin/ez-adam desktop builds
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

    - name: Clippy begin app (desktop features)
      run: cargo clippy -p begin --all-targets -- -D warnings

    - name: Clippy ez-adam app (desktop features)
      run: cargo clippy -p ez-adam --all-targets -- -D warnings
