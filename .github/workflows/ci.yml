name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  MDBOOK_VERSION: 0.5.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    
    - name: Install Rust toolchain
      run: |
        rustup toolchain install stable --profile minimal --component rustfmt --component clippy
        rustup default stable
    
    - name: Cache dependencies
      uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

    - name: Check formatting
      run: cargo fmt --check

    - name: Build workspace (excluding begin app)
      run: cargo build --workspace --exclude begin --verbose

    # --lib skips `xtask` automatically (it has no library target). `begin` is excluded
    # explicitly, not just left to `--lib`: `--lib` only filters which *targets* get
    # documented, not which packages are selected for feature resolution, so `begin`
    # staying selected via `--workspace` still unifies its `default = ["desktop"]`
    # feature (-> `dioxus/desktop` -> wry/tao -> WebKitGTK/GTK) into the build even
    # though nothing of `begin`'s ever gets documented -- and those system libraries
    # aren't installed until the later "Install Linux dependencies" step, so this failed
    # on the ubuntu-latest runner despite building fine locally on Windows/macOS,
    # neither of which route dioxus's desktop feature through GTK at all. RUSTDOCFLAGS
    # promotes rustdoc's own warnings (broken/private intra-doc links, bare URLs, etc.) to
    # errors -- `cargo doc` alone exits 0 on those, so without this they'd only ever
    # surface as a human happening to read `cargo doc`'s output locally.
    - name: Build documentation (deny warnings)
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo doc --workspace --exclude begin --no-deps --lib

    - name: Install mdBook
      run: cargo install mdbook --version "$MDBOOK_VERSION" --locked

    - name: Install the live-examples mdBook preprocessor
      run: cargo install --path adam-lang-book-preprocessor

    - name: Build the adam-lang-book-live wasm bundle
      run: |
        cargo install wasm-pack --locked
        cd adam-lang-book-live && wasm-pack build --target web --release

    - name: Prepare live-book assets (manifest + Spectrum bundle + wasm/js output)
      run: cargo run -p xtask -- prepare-live-book-assets

    # Catches a broken {{#include}} path/anchor in the adam-lang book (adam-lang-book/book-src)
    # the moment a chapter or its backing tests/*.rs example drifts out of sync -- mdbook build
    # fails outright on either, so no separate lint is needed. A missing mdbook-live-examples
    # binary or wasm bundle from the steps above would fail this the same way.
    - name: Build the adam-lang book
      run: mdbook build adam-lang-book

    - name: Build the CEL language book
      run: mdbook build cel-lang-book

    - name: Check begin app (renderer-agnostic)
      run: cargo check -p begin --no-default-features

    - name: Run tests for workspace (excluding begin app)
      run: cargo test --workspace --exclude begin --verbose -- --nocapture

    - name: Run tests for begin app (renderer-agnostic)
      run: cargo test -p begin --no-default-features --verbose -- --nocapture

    - name: Clippy workspace (excluding begin app)
      run: cargo clippy --workspace --exclude begin --all-targets -- -D warnings

    - name: Clippy begin app (renderer-agnostic)
      run: cargo clippy -p begin --no-default-features --all-targets -- -D warnings

    # dioxus's desktop feature pulls in wry/tao, which link against WebKitGTK/GTK on Linux.
    # No earlier step needs these: the workspace build/test excludes begin, and the other
    # begin checks use --no-default-features (renderer-agnostic), so this is the first step
    # that actually compiles the desktop feature on the ubuntu-latest runner.
    - name: Install Linux dependencies for begin desktop build
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

    - name: Clippy begin app (desktop features)
      run: cargo clippy -p begin --all-targets -- -D warnings
