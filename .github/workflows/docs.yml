name: Docs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  MDBOOK_VERSION: 0.5.4

# Only one Pages deployment may run at a time; let a newer push supersede an
# in-flight one rather than queuing behind it.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust toolchain
      run: |
        rustup toolchain install stable --profile minimal
        rustup default stable

    - name: Cache dependencies
      uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

    # --lib skips `xtask` automatically (it has no library target). `begin` and `ez-adam`
    # are excluded explicitly, not just left to `--lib`: either crate remaining selected
    # via `--workspace` enables its desktop feature and requires WebKitGTK/GTK on Linux.
    - name: Build documentation (deny warnings)
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo doc --workspace --exclude begin --exclude ez-adam --no-deps --lib

    - name: Redirect docs root to the cel-rs facade crate
      run: echo '<meta http-equiv="refresh" content="0; url=cel_rs/index.html">' > target/doc/index.html

    - name: Install mdBook
      run: cargo install mdbook --version "$MDBOOK_VERSION" --locked

    - name: Install the live-examples mdBook preprocessor
      run: cargo install --path adam-lang-book-preprocessor

    - name: Build the adam-lang-book-live wasm bundle
      run: |
        cargo install wasm-pack --locked
        cd adam-lang-book-live && wasm-pack build --target web --release

    - name: Prepare live-book assets (manifest + Spectrum bundle + wasm/js output)
      run: cargo run -p xtask -- prepare-live-book-assets

    - name: Set up Node for Adam slides
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: adam-slides/package-lock.json

    - name: Build the live Adam slide deck
      working-directory: adam-slides
      run: |
        npm ci
        npm test
        npm run build

    - name: Verify the live Adam slides in Chromium
      working-directory: adam-slides
      run: |
        npx playwright install --with-deps chromium
        npm run test:browser

    # The adam-lang tutorial/reference book links into this same rustdoc output (e.g.
    # `../adam_rs/sheet/struct.Sheet.html`), so it's built and published from target/doc
    # alongside it, not as a separate site.
    - name: Build the adam-lang book
      run: mdbook build adam-lang-book

    - name: Build the CEL language book
      run: mdbook build cel-lang-book

    # `cp -r src dst` only produces a flat `dst` when `dst` doesn't already exist; if
    # `target/doc/book` survived from a cached `target/` (Swatinem/rust-cache persists it
    # across runs), `cp -r` instead nests the source *into* it as `target/doc/book/book-dist`,
    # 404ing every link into `book/` (e.g. `cel-rs`'s root doc comment linking `../book/index.html`).
    # Removing any stale directory first keeps this step's result independent of what a
    # previous run left behind.
    - name: Copy the adam-lang book into the docs site
      run: |
        rm -rf target/doc/book
        cp -r adam-lang-book/book-dist target/doc/book

    - name: Copy the CEL language book into the docs site
      run: |
        rm -rf target/doc/cel-book
        cp -r cel-lang-book/book-dist target/doc/cel-book

    - name: Copy the Adam slides into the docs site
      run: |
        mkdir -p target/doc/adam-slides
        cp -r adam-slides/dist/. target/doc/adam-slides/

    - uses: actions/upload-pages-artifact@v5
      if: github.event_name == 'push'
      with:
        path: target/doc

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v5
